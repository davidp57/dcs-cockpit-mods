<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#f6f8fa"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2933">Appui court ou appui long, sur un bouton « … hold TSD »</text>

  <!-- time axis -->
  <line x1="190" y1="250" x2="720" y2="250" stroke="#3b4a5a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="190" y="274" text-anchor="middle" font-size="14" fill="#3b4a5a">appui</text>
  <text x="440" y="274" text-anchor="middle" font-size="14" fill="#b42318" font-weight="600">0,5 s</text>
  <text x="712" y="274" text-anchor="end" font-size="14" fill="#3b4a5a">temps</text>
  <line x1="440" y1="62" x2="440" y2="250" stroke="#b42318" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- short press -->
  <text x="30" y="110" font-size="16" font-weight="600" fill="#1f2933">Appui court</text>
  <text x="30" y="130" font-size="13" fill="#52606d">relâché avant 0,5 s</text>
  <rect x="190" y="92" width="150" height="26" rx="6" fill="#9fb3c8"/>
  <text x="265" y="110" text-anchor="middle" font-size="13" fill="#1f2933">bouton enfoncé</text>
  <circle cx="340" cy="105" r="7" fill="#2f7d4f"/>
  <text x="345" y="80" text-anchor="end" font-size="14" font-weight="600" fill="#2f7d4f">au relâchement : page suivante</text>

  <!-- long press -->
  <text x="30" y="200" font-size="16" font-weight="600" fill="#1f2933">Appui long</text>
  <text x="30" y="220" font-size="13" fill="#52606d">tenu jusqu'à 0,5 s</text>
  <rect x="190" y="182" width="400" height="26" rx="6" fill="#9fb3c8"/>
  <text x="315" y="200" text-anchor="middle" font-size="13" fill="#1f2933">bouton enfoncé</text>
  <circle cx="440" cy="195" r="7" fill="#2f7d4f"/>
  <text x="452" y="168" font-size="14" font-weight="600" fill="#2f7d4f">dès 0,5 s : page TSD</text>
  <text x="600" y="200" font-size="13" fill="#52606d">relâcher ne fait rien</text>
</svg>
