<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="250" rx="14" fill="#f6f8fa"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2933">Un appui court : page suivante du MPD</text>

  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="40" y="70" width="104" height="58" rx="10" fill="#1b3a2b" stroke="#2f7d4f" stroke-width="3"/>
    <text x="92" y="107" fill="#7CFC8a">FCR</text>
    <rect x="186" y="70" width="104" height="58" rx="10" fill="#1b3a2b" stroke="#2f7d4f" stroke-width="3"/>
    <text x="238" y="107" fill="#7CFC8a">WPN</text>
    <rect x="332" y="70" width="104" height="58" rx="10" fill="#1b3a2b" stroke="#2f7d4f" stroke-width="3"/>
    <text x="384" y="107" fill="#7CFC8a">TSD</text>
    <rect x="478" y="70" width="104" height="58" rx="10" fill="#1b3a2b" stroke="#2f7d4f" stroke-width="3"/>
    <text x="530" y="107" fill="#7CFC8a">VID</text>
    <rect x="624" y="70" width="104" height="58" rx="10" fill="#1b3a2b" stroke="#2f7d4f" stroke-width="3"/>
    <text x="676" y="107" fill="#7CFC8a">A/C</text>
  </g>

  <g stroke="#3b4a5a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="146" y1="99" x2="182" y2="99"/>
    <line x1="292" y1="99" x2="328" y2="99"/>
    <line x1="438" y1="99" x2="474" y2="99"/>
    <line x1="584" y1="99" x2="620" y2="99"/>
    <path d="M676,130 C676,190 92,190 92,134"/>
  </g>
  <text x="384" y="200" text-anchor="middle" font-size="15" fill="#3b4a5a">après A/C, on repart sur FCR</text>
  <text x="384" y="232" text-anchor="middle" font-size="15" fill="#52606d">même cycle sur le MPD gauche et sur le MPD droit, au siège pilote comme au siège tireur</text>
</svg>
