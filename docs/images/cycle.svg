  <text x="380" y="200" text-anchor="middle" font-size="15" fill="#3b4a5a">après ASE, on repart sur FCR</text>
  <text x="380" y="232" text-anchor="middle" font-size="15" fill="#52606d">même cycle sur le MPD gauche et sur le MPD droit, au siège pilote comme au siège tireur</text>
